<ion-content>
  <div id="pageTitle">
    <div>
      <ion-title id="title">Area personale giocatore</ion-title>
    </div>
  </div>


  <app-button id="goback"
    [button]="{text: 'Go Back', expand: 'false'}"
    [context]="buttonCallbacks['goBack']"
  ></app-button>
  <app-button
    [button]= "{ text: 'Vai alle campagne', expand: ''}"
    [context]= "buttonCallbacks['goToCampaigns']"
  ></app-button>

  <div class="characters">
    <div class="add-button">
      <div>
        <app-button
        [button]="{text: '+', expand: 'false'}"
        [context]="buttonCallbacks['createChar']"
        ></app-button>
      </div>
    </div>
    @for(card of cards(); track $index) {
      <div class="separator"></div>
      <app-character-card 
      [card]="card"
      ></app-character-card>
    }
  </div>


</ion-content>
