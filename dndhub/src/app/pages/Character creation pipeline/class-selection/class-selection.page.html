<ion-content>  
  <app-title
  [title] = "'Scegli la tua classe'"
  ></app-title>


  <!-- Sezione dedicata alla scelta della classe con menù a tendina
      NB: ogni menù a tendina dovrebbe avere all'interno un bottone 
      (o simile) che permette di selezionare quella classe tramite
      un booleano (o simile) -->

  <div class="goBack genericButton">
    <app-button
    [button] = "{ text: 'Torna indietro', expand: ''}"
    [context] = "b2_context"
    ></app-button>
  </div>

  <div class="classSelectionFrame">
    <app-accordion
      [accordions] = "accordions"
      [allowMultipleEnabled] = "true"
    ></app-accordion>
  </div>

  <!-- Sezione dedicata alla selezione del livello 
      Ancora con elementi placeholder perché il number
      selector non è stato ancora implementato -->

  <div class="levelSelectionFrame">
    <ion-label class="levelSelectionLabel">
        Scegli un livello per il personaggio (1-20):
    </ion-label>
    <app-drag-entry
    [min] = 1
    [max] = 20
    [sensitivity] = 1
    ></app-drag-entry>
  </div>

  <div class="nextPage genericButton">
    <app-button
    [button] = "{ text: 'Prossima pagina', expand: ''}"
    [context] = "buttonCallbacks['nextPage']"
    ></app-button>
  </div>
</ion-content>
