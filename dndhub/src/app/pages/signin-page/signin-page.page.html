<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="logo">DnDhub</ion-title>
    <ion-title class="title">Registrati</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content">

  <div class="background"></div>

  <div class="form">
    <ion-text class="subtitle">
      Inserisci le tue credenziali per registrarti.
    </ion-text>

    <div class="entry-group">
      <app-entry #username class="entry"
        placeholder="Inserisci il nome utente"
        fill="outline"
        label="Nome utente"
        labelPlacement="floating"
      ></app-entry>
      <div class="padding"></div>
      <app-entry #email class="entry"
        placeholder="Inserisci l'indirizzo email"
        fill="outline"
        label="Email"
        labelPlacement="floating"
      ></app-entry>
      <div class="padding"></div>
      <app-entry #password class="entry"
        placeholder="Inserisci la password"
        fill="outline"
        label="Password"
        labelPlacement="floating"
      ></app-entry>
      <app-button
      [button]="{text: 'Registrati', expand: 'false'}"
      [context]="{onClick: doRegister}"
      ></app-button>
    </div>

    <div class="link-wrapper">
      <ion-text>
        Hai già un account?
      </ion-text>

      <a routerLink="/login-page" class="login-page-link">
        Accedi ora!
      </a> 
    </div>

  </div>

</ion-content>
