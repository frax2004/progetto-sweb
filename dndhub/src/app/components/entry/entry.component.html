@if (passwordToggle === true) {
    <ion-input #input
    [label]="label" 
    [labelPlacement]="labelPlacement"
    [type]="type"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [value]="value"
    >
    <ion-input-password-toggle slot="end"></ion-input-password-toggle>
    </ion-input>
}
@else {
    <ion-input #input
    [label]="label" 
    [labelPlacement]="labelPlacement"
    [type]="type"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [value]="value"
    ></ion-input>
}
