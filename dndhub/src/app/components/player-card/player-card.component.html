  <div class="player-card">
    <div class="avatar" [style.backgroundImage]="'url(' + player.immagine + ')'"></div>

    <div class="right">
      <p class="row">Account: {{ player.profilo }}</p>
      <p class="row">Nome: {{ player.nome }}</p>
      <p class="row">Classe: {{ player.classe }}</p>
      <p class="row">Razza: {{ player.razza }}</p>
      <p class="row">Livello: {{ player.livello }}</p>
    </div>
  </div>
