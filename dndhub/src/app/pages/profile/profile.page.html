<ion-content>
  <ion-split-pane when="xs" contentId="main">
    <ion-menu contentId="main">
      <ion-header>
        <ion-toolbar>
          <ion-title>Profilo Personale</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <div class="outerImgFrame">
          <div class="imgFrame">
            <img src="https://static.wikia.nocookie.net/dragonball/images/9/91/SSJ4_20.jpg/revision/latest/scale-to-width-down/985?cb=20240630012825" alt="'imgPlaceholder'">
          </div>
        </div>
        
        <div class="buttonContainer">
          <app-button class="btn" 
            [margin]="false"
            [button]="{text: 'Torna indietro', expand: 'false'}"
            [context] = "buttonCallbacks['goBack']"
            ></app-button>
          <app-button class="btn"
            [margin]="false"
            [button] = "{ text: 'Modifica account', expand: ''}"
            [context] = "buttonCallbacks['enableAccountEdit']"
          ></app-button>
          <app-button class="btn"
            [margin]="false"
            [button] = "{ text: 'Elimina account', expand: ''}"
            [context] = "buttonCallbacks['placeholder']"
          ></app-button>
          <app-button class="btn"
            [margin]="false"
            [button] = "{ text: 'Effettua l\'uscita', expand: ''}"
            [context] = "buttonCallbacks['placeholder']"
          ></app-button>
        </div>

      </ion-content>
    </ion-menu>

    <div class="ion-page" id="main">
      <ion-content class="ion-padding"> 
        <div class="entry-container">
          <app-entry #username
            placeholder="Nome utente"
            [disabled]="false"
          ></app-entry>
          <app-entry #email
            placeholder="Indirizzo email"
            [disabled]="false"
          ></app-entry>
          <app-entry #password
            placeholder="Password"
            [disabled]="false"
          ></app-entry>
            <app-button class="save-button"
              [margin]="false"
              [button] = "{ text: 'Salva', expand: ''}"
              [context] = "buttonCallbacks['save']"
          ></app-button>
        </div>
      </ion-content>
    </div>
  </ion-split-pane>
</ion-content>
