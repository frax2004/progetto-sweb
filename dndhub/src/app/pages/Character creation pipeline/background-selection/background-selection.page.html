<ion-content>
  <app-title
  [title] = "'Scegli il tuo background'"
  ></app-title>

  <div class="goBack">
    <app-button
    [button] = "{ text: 'Torna indietro', expand: ''}"
    [context] = "buttonCallbacks['previousPage']"
    ></app-button>
  </div>

  <!-- Sezione iniziale per la scelta dei background -->
  <div class="backgroundSelectionFrame">
    <app-accordion
      [accordions] = "accordions"
      [allowMultipleEnabled] = "true"
    ></app-accordion>
  </div>

  <!-- footer con bottone per andare alla prossima pagina -->
  <div class="nextPage">
      <app-button
      [button] = "{ text: 'Prossima pagina', expand: ''}"
      [context] = "buttonCallbacks['nextPage']"
      ></app-button>
  </div>
</ion-content>
