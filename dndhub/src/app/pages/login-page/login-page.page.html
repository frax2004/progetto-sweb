<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="logo">DnDhub</ion-title>
    <ion-title class="title">Accedi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="signin-content">

  <div class="background"></div>

  <div class="form">
    <ion-text class="subtitle">
      Inserisci le tue credenziali per accedere.
    </ion-text>

    <div class="entry-group">
      <app-entry #email class="entry"
        placeholder="Inserisci l'indirizzo email"
        fill="outline"
        label="Email"
        labelPlacement="floating"
      ></app-entry>
      <app-entry #password class="entry"
        placeholder="Inserisci la password"
        fill="outline"
        label="Password"
        labelPlacement="floating"
      ></app-entry>
      <app-button
      [button]="{text: 'Accedi', expand: 'false'}"
      [context]="{onClick: doLogin}"
      ></app-button>
    </div>

    <div class="link-wrapper">
      <ion-text>
        Non hai un account?
      </ion-text>

      <a routerLink="/signin-page" class="signin-page-link">
        Registrati ora!
      </a> 
    </div>

  </div>

</ion-content>
